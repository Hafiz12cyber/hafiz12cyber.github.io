name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AE314D: ${{ secrets.AE314D }}
          B96ABA: ${{ secrets.B96ABA }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AE314D', '')
          bm = os.environ.get('B96ABA', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- d8164dba0999eaadc0959345ca -->', gm)
          if bm:
              s2 = s2.replace('<!-- 8f9c194ce35fd79a5d108053e2ef16e918adbb -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
